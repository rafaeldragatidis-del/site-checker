name: Daily Website Security Check

on:
  schedule:
    # Τρέχει αυτόματα κάθε μέρα στις 09:00 UTC (12:00 ώρα Ελλάδας)
    - cron: '0 9 * * *'
  workflow_dispatch: # Σου επιτρέπει να το τρέχεις χειροκίνητα με ένα κουμπί

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run script
      env:
        URLS_TO_CHECK: ${{ secrets.URLS_TO_CHECK }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python site_checker.py
