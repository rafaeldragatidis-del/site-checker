name: Daily Website Security Check

on:
  schedule:
    - cron: '0 12 * * *' # Τρέχει κάθε μέρα στις 12:00
  workflow_dispatch: # Σου επιτρέπει να το τρέχεις χειροκίνητα

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run script
      env:
        URLS_TO_CHECK: ${{ secrets.URLS_TO_CHECK }}
        MY_EMAIL: ${{ secrets.MY_EMAIL }}
        CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
        MY_GMAIL_APP_PASSWORD: ${{ secrets.MY_GMAIL_APP_PASSWORD }}
      run: python site_checker.py
